name: Build & Release

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build zip
        run: bash bin/build.sh && mv ../plugin-risk-radar-*.zip .

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: plugin-zip
          path: plugin-risk-radar-*.zip

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download artifact
        uses: actions/download-artifact@v4
        with:
          name: plugin-zip

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: plugin-risk-radar-*.zip
          name: Plugin Risk Radar ${{ github.ref_name }}
          generate_release_notes: true
